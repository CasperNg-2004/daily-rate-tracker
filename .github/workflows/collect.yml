name: Collect MYR exchange rates

on:
  schedule:
    - cron: "17 1 * * *"   # every day at 01:17 UTC = 09:17 Malaysia time
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write            # lets the workflow commit the updated data

# Never run two collections at the same time; a second run waits for the first.
concurrency:
  group: collect-rates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest rates
        run: python scripts/collect.py

      - name: Check alerts and send email
        id: alerts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python scripts/alerts.py

      # Runs even if the alert step failed, so the day's rates are never lost.
      # (The run is still marked failed, and GitHub emails you about it.)
      - name: Commit new data (if any)
        if: ${{ !cancelled() && steps.alerts.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data today."
            exit 0
          fi
          git commit -m "data: update rates $(date -u +%F)"
          # If you edited the repo while this ran, pull your changes first, then push.
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            echo "Push attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
